services:
  mongodb:
    image: mongo:7
    # Not published to the host on purpose: only containers on this compose
    # network (the api) can reach it. For host access (mongosh, Compass,
    # running uvicorn locally), uncomment:
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
